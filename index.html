<style>
:root{--mist:#EEF3F2;--card:#fff;--basalt:#233038;--sea:#0F6E74;--tang:#EF7B1C;--camellia:#C4455A;--stone:#6F7D83;--line:#D7E0DF;--warn:#A4480F;--warnbg:#FFF0E2}

html,body{margin:0}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--mist);color:var(--basalt);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}

.day.on{background:var(--basalt);border-color:var(--basalt);color:#fff}

.day.on .hol{color:#FFB3BE}
.mapbox{position:relative;margin:0 16px;height:44vh;min-height:280px;max-height:440px;border-radius:16px;overflow:hidden;background:#DCE6E5}

#map.ready{visibility:visible}
#fallback svg{width:100%;height:100%}
.maphint{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.94);border-radius:10px;padding:8px 10px;font-size:12px;display:none}

.pin{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 5px rgba(35,48,56,.4);cursor:pointer}

.pin.base{width:auto;height:24px;padding:0 8px;border-radius:7px;font-size:12px;background:var(--basalt)}
.sec{padding:18px 16px 4px}
.dayhead h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.dayhead p{margin:2px 0 0;color:var(--stone);font-size:14px}
.note{margin:10px 0 0;font-size:13px;background:#FBE9EC;color:#8E2B3B;border-radius:10px;padding:8px 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.row label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
input[type=time]{font:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:10px;padding:5px 8px;background:#fff;color:var(--basalt)}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600}
.btn.dark{background:var(--basalt);border-color:var(--basalt);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--stone)}
.tl{list-style:none;margin:14px 0 0;padding:0}
.node{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:10px 12px}

.node .pin{flex:0 0 auto;margin-top:1px;cursor:default}
.node .info{flex:1;min-width:0}

.node .meta{display:block;font-size:12px;color:var(--stone)}

.warn{display:block;margin-top:4px;font-size:12px;color:var(--warn);background:var(--warnbg);border-radius:6px;padding:3px 7px}

.scrim.open{opacity:1;pointer-events:auto}

.cal .mid{background:#DCE8E7}

.cal .edge small{color:#FFB3BE}

</style>
</head>

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>BASE[id]||PLACES.find(p=>p.id===id);
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const md=k=>{const d=parse(k);return (d.getMonth()+1)+'.'+d.getDate()+' '+DOW[d.getDay()]};
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const fm=m=>{m=Math.round(m);return pad(Math.floor(m/60)%24)+':'+pad(m%60)};

let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.range) S={range:{from:'2026-09-23',to:'2026-09-26'},plans:{},cur:'2026-09-23'};

function days(){const out=[];let d=parse(S.range.from);const e=parse(S.range.to);while(d<=e){out.push(key(d));d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)}return out}
function plan(k){if(!S.plans[k])S.plans[k]={ids:[],manual:false,start:null};return S.plans[k]}
function role(k){const ds=days(),i=ds.indexOf(k);if(ds.length===1)return 'both';if(i===0)return 'arrive';if(i===ds.length-1)return 'depart';return 'stay'}
const ROLE={
  arrive:{t:'도착일',s:'3시 비행기 → 도착해서 렌터카 받고 출발'},
  stay:{t:'리조트에서 출발',s:'금호제주리조트에서 나갔다가 돌아와요'},
  depart:{t:'돌아가는 날',s:'렌터카 3시 반납 · 4시 비행기'},
  both:{t:'당일 일정',s:'공항에서 출발해 렌터카 반납까지'}
};
function startTime(k){const p=plan(k),r=role(k);return p.start||((r==='arrive'||r==='both')?'16:30':'09:30')}
function ends(k){const r=role(k);return{start:(r==='arrive'||r==='both')?BASE.AIR:BASE.RES,end:(r==='depart'||r==='both')?BASE.RENT:BASE.RES}}

function hav(a,b){const R=6371,t=Math.PI/180,dLa=(b.lat-a.lat)*t,dLo=(b.lng-a.lng)*t;const x=Math.sin(dLa/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function legMin(a,b){const d=hav(a,b);if(d<0.4)return 2;return Math.round(d*1.35/40*60+6)}
function cost(s,e,arr){let c=0,p=s;for(const x of arr){c+=legMin(p,x);p=x}return c+legMin(p,e)}
function permute(a,cb){const n=a.length,c=new Array(n).fill(0),arr=a.slice();cb(arr);let i=0;while(i<n){if(c[i]<i){if(i%2===0)[arr[0],arr[i]]=[arr[i],arr[0]];else[arr[c[i]],arr[i]]=[arr[i],arr[c[i]]];cb(arr);c[i]++;i=0}else{c[i]=0;i++}}}
function optimize(k){
  const p=plan(k),{start,end}=ends(k),pts=p.ids.map(byId).filter(Boolean);
  if(pts.length<2)return;
  let best=pts.slice(),bc=cost(start,end,pts);
  if(pts.length<=7){permute(pts,arr=>{const c=cost(start,end,arr);if(c<bc){bc=c;best=arr.slice()}})}
  else{
    let rest=pts.slice(),cur=start,route=[];
    while(rest.length){rest.sort((a,b)=>legMin(cur,a)-legMin(cur,b));cur=rest.shift();route.push(cur)}
    let imp=true;
    while(imp){imp=false;for(let i=0;i<route.length-1;i++)for(let j=i+1;j<route.length;j++){const r2=route.slice(0,i).concat(route.slice(i,j+1).reverse(),route.slice(j+1));if(cost(start,end,r2)<cost(start,end,route)){route=r2;imp=true}}}
    best=route;
  }
  p.ids=best.map(x=>x.id);
}

function compute(k){
  const p=plan(k),r=role(k),{start,end}=ends(k),dow=parse(k).getDay();
  let t=toMin(startTime(k)),prev=start;const stops=[];
  p.ids.map(byId).filter(Boolean).forEach(x=>{
    const leg=legMin(prev,x);t+=leg;const arr=t;t+=x.dur;
    const w=[];
    if(x.closed&&x.closed.includes(dow))w.push('평소 '+DOW[dow]+'요일 휴무라고 안내돼 있어요. 전화로 확인해 주세요.');
    if(x.cat==='eat'&&!x.takeout&&!((arr>=660&&arr<=870)||(arr>=1020&&arr<=1230)))w.push('식사 시간과 조금 어긋나요. ↑↓로 순서를 옮겨보세요.');
    stops.push({p:x,leg,arr,dep:t,w});prev=x;
  });
  const lastLeg=legMin(prev,end);t+=lastLeg;
  return{start,end,stops,lastLeg,endArr:t,role:r};
}

/* ---------- mini island map (SVG) ---------- */
const COAST=[[126.16,33.31],[126.18,33.36],[126.24,33.41],[126.31,33.45],[126.38,33.47],[126.49,33.51],[126.57,33.52],[126.66,33.54],[126.76,33.56],[126.84,33.55],[126.90,33.52],[126.94,33.46],[126.93,33.43],[126.86,33.34],[126.80,33.31],[126.72,33.28],[126.62,33.25],[126.55,33.24],[126.45,33.24],[126.37,33.23],[126.29,33.20],[126.22,33.22],[126.18,33.26]];
const CCOL={play:'#0F6E74',eat:'#EF7B1C',sweet:'#C4455A',stay:'#233038'};
function islandSVG(k,W,H,big,on,only){
  const X=l=>((l-126.12)/0.88*W).toFixed(1),Y=l=>((33.60-l)/0.43*H).toFixed(1);
  const land=COAST.map(c=>X(c[0])+','+Y(c[1])).join(' ');
  let pts,cats=[],inner='';
  if(only){pts=[only];cats=[only.cat||'stay']}
  else{const r=compute(k);pts=[r.start,...r.stops.map(s=>s.p),r.end];cats=['base',...r.stops.map(s=>s.p.cat),'base']}
  const lineCol=on?'#EF7B1C':'#233038';
  const landFill=on?'rgba(255,255,255,.14)':'#E4ECEA', landStroke=on?'rgba(255,255,255,.35)':'#C7D3D1';
  if(!only&&pts.length>1)inner+=`<polyline points="${pts.map(p=>X(p.lng)+','+Y(p.lat)).join(' ')}" fill="none" stroke="${lineCol}" stroke-width="${big?2.5:1.6}" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{
    const c=cats[i];
    if(c==='base'){inner+=`<rect x="${(X(p.lng)-(big?5:2.5))}" y="${(Y(p.lat)-(big?5:2.5))}" width="${big?10:5}" height="${big?10:5}" rx="${big?2:1}" fill="${on?'#fff':'#233038'}"/>`}
    else{inner+=`<circle cx="${X(p.lng)}" cy="${Y(p.lat)}" r="${big?8:2.8}" fill="${CCOL[c]}" stroke="#fff" stroke-width="${big?1.5:.8}"/>`;
      if(big&&!only)inner+=`<text x="${X(p.lng)}" y="${(+Y(p.lat)+3.5).toFixed(1)}" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">${i}</text>`}
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><polygon points="${land}" fill="${landFill}" stroke="${landStroke}" stroke-width="1"/>${inner}</svg>`;
}

    r.stops.forEach((s,i)=>{

    });
    h+=`<li class="leg">${r.lastLeg<=2?'걸어서 잠깐':'차로 약 '+r.lastLeg+'분'}</li><li class="node base"><span class="t">${fm(r.endArr)}</span><span class="pin base">${r.end.short}</span><div class="info"><b>${esc(r.end.name)}</b><span class="meta">${r.end.id==='RES'?'숙소 도착':'반납 도착'}</span></div></li></ol>`;
    if(r.end.id==='RENT'&&r.endArr>15*60-10)h+=`<span class="warn endwarn">렌터카 반납 3시보다 약 ${r.endArr-(15*60-10)}분 늦어요. 한 곳을 빼거나 출발을 당겨주세요.</span>`;
    else if(r.end.id==='RES'&&r.endArr>21*60+30)h+=`<span class="warn endwarn">숙소 도착이 9시 반을 넘어요. 아이들 컨디션을 생각하면 한 곳 빼는 걸 추천해요.</span>`;
  }
  $('#plan').innerHTML=h;
}

function move(i,dir){const p=plan(S.cur),j=i+dir;if(j<0||j>=p.ids.length)return;[p.ids[i],p.ids[j]]=[p.ids[j],p.ids[i]];p.manual=true;renderAll()}

  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='day'){S.cur=el.dataset.k;renderAll()}
  else if(a==='toggle'){toggle(el.dataset.id);if($('#sheet').classList.contains('open')&&sheetMode==='place')openPlace(el.dataset.id)}
  else if(a==='open')openPlace(el.dataset.id);
  else if(a==='up')move(+el.dataset.i,-1);
  else if(a==='down')move(+el.dataset.i,1);
  else if(a==='auto'){const p=plan(S.cur);p.manual=false;optimize(S.cur);renderAll()}
  else if(a==='rec'){const p=plan(S.cur);(REC[S.cur]||[]).forEach(id=>{if(!p.ids.includes(id))p.ids.push(id)});if(!p.manual)optimize(S.cur);renderAll()}
  else if(a==='clear'){if(confirm('이날 담은 장소를 모두 뺄까요?')){const p=plan(S.cur);p.ids=[];p.manual=false;renderAll()}}
  else if(a==='filter'){filter=el.dataset.f;renderPicker()}

  else if(a==='calnav'){const d=new Date(cal.y,cal.m+(+el.dataset.d),1);cal.y=d.getFullYear();cal.m=d.getMonth();renderCal()}
  else if(a==='calday')pickDay(el.dataset.k);
  else if(a==='calok')confirmCal();
  else if(a==='close')closeSheet();
});

function openPlace(id){

  const route='https://map.kakao.com/link/to/'+encodeURIComponent(x.name)+','+x.lat+','+x.lng;
  const dow=parse(S.cur).getDay();
  openSheet(`<h4>${esc(x.name)}</h4><div class="meta">${CAT[x.cat]||''} · ${x.area} · 숙소에서 ${x.drive} · ${x.dur}분 정도</div><p>${esc(x.desc)}</p>${x.tip?`<p class="meta">${esc(x.tip)}</p>`:''}${x.closed&&x.closed.includes(dow)?`<span class="warn">평소 ${DOW[dow]}요일 휴무라고 안내돼 있어요.</span>`:''}<div id="smap"></div><div class="acts"><button class="btn ${inn?'':'dark'}" data-act="toggle" data-id="${x.id}">${inn?md(S.cur)+'에서 빼기':md(S.cur)+'에 담기'}</button><a class="btn" href="${search}" target="_blank" rel="noopener">카카오맵에서 보기</a><a class="btn" href="${route}" target="_blank" rel="noopener">길찾기</a>${x.tel?`<a class="btn" href="tel:${x.tel}">전화 ${x.tel}</a>`:''}</div>`,'place');
  const box=$('#smap');
  if(mapReady){try{new kakao.maps.StaticMap(box,{center:new kakao.maps.LatLng(x.lat,x.lng),level:5,marker:{position:new kakao.maps.LatLng(x.lat,x.lng)}});return}catch(e){}}
  box.innerHTML=islandSVG(null,340,199,true,false,x);
}

/* ---------- calendar ---------- */
let cal={};
function openCal(){const d=parse(S.range.from);cal={y:d.getFullYear(),m:d.getMonth(),a:S.range.from,b:S.range.to,picking:false};renderCal()}
function renderCal(){
  const first=new Date(cal.y,cal.m,1),n=new Date(cal.y,cal.m+1,0).getDate();
  let g=DOW.map(w=>`<div class="dw">${w}</div>`).join('');
  for(let i=0;i<first.getDay();i++)g+='<div></div>';
  for(let d=1;d<=n;d++){
    const k=key(new Date(cal.y,cal.m,d)),dt=new Date(cal.y,cal.m,d);
    let c='';if(cal.a&&cal.b&&k>cal.a&&k<cal.b)c='mid';if(k===cal.a||k===cal.b)c='edge';
    if(dt.getDay()===0&&c!=='edge')c+=' sun';
    g+=`<button class="${c}" data-act="calday" data-k="${k}">${d}${HOLI[k]?'<small>'+HOLI[k]+'</small>':''}</button>`;
  }
  const html=`<div class="calhead"><button class="btn ghost" data-act="calnav" data-d="-1" aria-label="이전 달">‹</button><b>${cal.y}년 ${cal.m+1}월</b><button class="btn ghost" data-act="calnav" data-d="1" aria-label="다음 달">›</button></div><div class="cal">${g}</div><p class="calhint">${cal.picking?'마지막 날을 눌러주세요.':'첫날과 마지막 날을 차례로 눌러주세요. 지금: '+md(cal.a)+' – '+(cal.b?md(cal.b):'?')}</p><div class="acts"><button class="btn dark" data-act="calok" ${cal.b?'':'disabled'}>이 기간으로 정하기</button><button class="btn" data-act="close">닫기</button></div>`;
  if(sheetMode==='cal')$('#sheetBody').innerHTML=html;else openSheet(html,'cal');
}
function pickDay(k){
  if(!cal.picking){cal.a=k;cal.b=null;cal.picking=true}
  else{if(k<cal.a){cal.b=cal.a;cal.a=k}else cal.b=k;cal.picking=false;
    const len=(parse(cal.b)-parse(cal.a))/864e5+1;if(len>10){alert('기간은 10일까지 고를 수 있어요.');cal.b=null;cal.picking=true}}
  renderCal();
}
function confirmCal(){if(!cal.b)return;S.range={from:cal.a,to:cal.b};if(!days().includes(S.cur))S.cur=cal.a;closeSheet();renderAll()}

/* ---------- kakao map ---------- */
let map=null,mapReady=false,overlays=[],line=null;
function drawMap(){
  $('#fallback').innerHTML=islandSVG(S.cur,340,199,true,false);
  if(!mapReady)return;
  overlays.forEach(o=>o.setMap(null));overlays=[];if(line){line.setMap(null);line=null}
  const r=compute(S.cur),pts=[r.start,...r.stops.map(s=>s.p),r.end];
  const path=pts.map(p=>new kakao.maps.LatLng(p.lat,p.lng));
  line=new kakao.maps.Polyline({map,path,strokeWeight:4,strokeColor:'#233038',strokeOpacity:.85,strokeStyle:'solid'});
  const addPin=(p,label,cls,id,z)=>{
    const el=document.createElement('div');el.className='pin '+cls;el.textContent=label;
    if(id)el.addEventListener('click',()=>openPlace(id));
    const o=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(p.lat,p.lng),content:el,yAnchor:.5,xAnchor:.5,zIndex:z});
    o.setMap(map);overlays.push(o);
  };
  addPin(r.start,r.start.short,'base',null,1);
  if(r.end.id!==r.start.id)addPin(r.end,r.end.short,'base',null,1);
  r.stops.forEach((s,i)=>addPin(s.p,i+1,s.p.cat,s.p.id,10+i));
  const b=new kakao.maps.LatLngBounds();path.forEach(l=>b.extend(l));
  if(r.stops.length===0&&r.start.id===r.end.id){map.setCenter(path[0]);map.setLevel(7)}
  else map.setBounds(b,50,40,50,40);
}
function loadKakao(){
  const s=document.createElement('script');
  s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+KAKAO_KEY+'&autoload=false&libraries=services';
  s.onload=()=>{try{kakao.maps.load(initMap)}catch(e){showHint()}};
  s.onerror=showHint;
  document.head.appendChild(s);
  setTimeout(()=>{if(!mapReady)showHint()},8000);
}
function showHint(){$('#maphint').classList.add('show')}
function initMap(){
  map=new kakao.maps.Map($('#map'),{center:new kakao.maps.LatLng(33.38,126.56),level:10});
  map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);
  mapReady=true;$('#map').classList.add('ready');$('#maphint').classList.remove('show');
  drawMap();geocode();
}
window.addEventListener('resize',()=>{if(mapReady){map.relayout();drawMap()}});

/* ---------- 정확한 좌표: 카카오 장소 검색 ---------- */
function loadGeo(){try{return JSON.parse(localStorage.getItem(GEO))||{}}catch(e){return{}}}
function applyGeo(g){
  Object.keys(g).forEach(id=>{const p=byId(id);if(p){p.lat=g[id].lat;p.lng=g[id].lng;if(g[id].url)p.url=g[id].url;if(g[id].tel&&!p.tel)p.tel=g[id].tel}});
  PLACES.filter(p=>p.atRes).forEach(p=>{p.lat=BASE.RES.lat;p.lng=BASE.RES.lng});
}
async function geocode(){
  if(!kakao.maps.services)return;
  const ps=new kakao.maps.services.Places(),g=loadGeo();
  const todo=[...Object.values(BASE),...PLACES].filter(p=>p.q!==false&&!g[p.id]);
  if(!todo.length)return;
  for(const p of todo){
    await new Promise(res=>{
      try{ps.keywordSearch(p.q||p.name,(data,status)=>{
        if(status===kakao.maps.services.Status.OK){const hit=data.find(d=>hav({lat:+d.y,lng:+d.x},p)<8);if(hit)g[p.id]={lat:+hit.y,lng:+hit.x,url:hit.place_url,tel:hit.phone}}
        res();
      },{location:new kakao.maps.LatLng(p.lat,p.lng),radius:20000})}catch(e){res()}
    });
    await new Promise(r=>setTimeout(r,120));
  }
  try{localStorage.setItem(GEO,JSON.stringify(g))}catch(e){}
  applyGeo(g);
  Object.keys(S.plans).forEach(k=>{if(!S.plans[k].manual&&days().includes(k))optimize(k)});
  renderAll();
}

/* ---------- start ---------- */
applyGeo(loadGeo());
(function(){const t=key(new Date());if(days().includes(t))S.cur=t;else if(!days().includes(S.cur))S.cur=S.range.from})();
renderAll();
loadKakao();
</script>
